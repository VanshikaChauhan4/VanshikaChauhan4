<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#90CAF9"/><stop offset="1" stop-color="#B0BEC5"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E88E5"/><stop offset="1" stop-color="#455A64"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0D47A1"/><stop offset="1" stop-color="#263238"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#42A5F5" stop-opacity=".45"/><stop offset="1" stop-color="#42A5F5" stop-opacity="0"/></radialGradient>
    <path id="orbit" d="M 60,170 A 140,45 0 1,1 340,170 A 140,45 0 1,1 60,170"/>
  </defs>
  <ellipse cx="200" cy="255" rx="90" ry="14" fill="url(#glow)">
    <animate attributeName="rx" values="90;70;90" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="200" cy="170" rx="140" ry="45" fill="none" stroke="#607D8B" stroke-opacity=".5" stroke-dasharray="4 6"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4s" repeatCount="indefinite"/>
    <polygon points="139,115 200,150 200,220 139,185" fill="url(#left)" stroke="#CFD8DC" stroke-opacity=".6"/>
    <polygon points="200,150 261,115 261,185 200,220" fill="url(#right)" stroke="#CFD8DC" stroke-opacity=".6"/>
    <polygon points="200,80 261,115 200,150 139,115" fill="url(#top)" stroke="#ECEFF1" stroke-opacity=".8"/>
    <text x="200" y="130" text-anchor="middle" font-family="monospace" font-size="16" font-weight="bold" fill="#0D47A1">&lt;/&gt;</text>
  </g>
  <circle r="7" fill="#42A5F5"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
  <circle r="5" fill="#B0BEC5"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite"><mpath href="#orbit"/></animateMotion></circle>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
